[project]
name = "marktradar"
version = "0.1.0"
description = "Marktanteilsprognose für Schweizer Krankenversicherer aus öffentlichen BAG-Daten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.10",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typer>=0.29.1",
    "uvicorn>=0.34.0",
]

[project.scripts]
marktradar = "marktradar.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S", "SIM", "PD", "NPY"]
ignore = ["N803", "N806"]  # X als Name ist in ML-Code üblich

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=marktradar --cov-report=term-missing"
