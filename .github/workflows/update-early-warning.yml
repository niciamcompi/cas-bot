# Aktualisiert das monatliche Frühwarnsystem automatisch:
# lädt UCDP-, Weltbank- und Wikipedia-Nachrichtendaten, trainiert alle Modelle neu und
# committet Bericht, Grafiken und Beobachtungslisten zurück ins Repository.
name: Update Early Warning (monthly)

on:
  schedule:
    - cron: "41 5 22 * *"    # monatlich am 22. um 05:41 UTC (nach der neuen UCDP-Candidate-Version)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-early-warning
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RISK_REFRESH: "1"
    defaults:
      run:
        working-directory: early_warning_monthly

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::readr
            any::jsonlite
            any::ggplot2
            any::patchwork
            any::countrycode
            any::glmnet
            any::ranger
            any::gbm
            any::pROC
            any::tidytext
            any::zoo

      # Archiv der Wikipedia-Nachrichten zwischen den Läufen behalten (alte Monate ändern sich nicht)
      - uses: actions/cache@v4
        with:
          path: early_warning_monthly/data/raw/wikinews
          key: wikinews-${{ github.run_id }}
          restore-keys: wikinews-

      - name: Frühwarnsystem neu rechnen
        run: Rscript run_all.R

      - name: Ergebnisse committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A output
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Ergebnissen."
          else
            git commit -m "Update early warning system ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Ergebnisse als Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-warning-output
          path: early_warning_monthly/output
          retention-days: 30
