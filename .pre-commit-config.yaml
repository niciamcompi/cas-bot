repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.9.8
    hooks:
      - id: ruff
        args:
          - "--extend-select=I,N,FAST"
          - "--fix"
          - "--line-length=88"
      - id: ruff-format
